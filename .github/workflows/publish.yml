name: Publish
on:
  # Fired when the release PR merges. Independent of the release job so a failed
  # publish is re-runnable — registry tags are immutable, so a half-finished
  # release must be resumable, not repeatable.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v0.1.0rc5"
        required: true
        type: string

permissions:
  contents: read
  packages: write        # ghcr image push via GITHUB_TOKEN

env:
  IMAGE: ghcr.io/powabase-ai/powabase-studio

jobs:
  # Its own job, not a step inside `build`. Both `build` and `manifest` need the
  # version, and a step output is not visible across jobs — resolving it inside
  # `build` would leave `manifest` interpolating an empty string and pushing an
  # untagged image, which succeeds silently. A matrix job's outputs are also
  # written by whichever leg finishes last, so this cannot live there either.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - name: Resolve version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF="${{ github.event.release.tag_name || inputs.tag }}"
          test -n "$REF" || { echo "::error::no release tag and no tag input"; exit 1; }
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}"       >> "$GITHUB_OUTPUT"
          # Resolve the tag to its commit explicitly rather than trusting
          # `github.sha`, which on a release event is the head of the ref the
          # release was created from and not necessarily the tagged commit.
          # Consumers of this source pin the COMMIT: a tag can be moved with a
          # force push, and this repository has no tag-protection ruleset, so a
          # name is not a durable answer to "what source was this built from".
          SHA=$(gh api "repos/${{ github.repository }}/commits/${REF}" --jq '.sha')
          test -n "$SHA" || { echo "::error::could not resolve ${REF} to a commit"; exit 1; }
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "resolved ${REF} -> ${SHA}"

  # Studio is a Node build — QEMU cross-build SIGILLs, so build each arch on a
  # NATIVE runner (push by digest), then assemble a multi-arch manifest.
  build:
    name: powabase-studio → ghcr (${{ matrix.arch }} native)
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # Build the released commit, not the branch tip.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build self-host Studio (IS_PLATFORM=false; push BY DIGEST)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/apps/studio/Dockerfile
          # NEXT_PUBLIC_* are inlined at build time — must be baked here (billing UI
          # off). Kept in sync with docker-compose.yml's former build.args.
          build-args: |
            NEXT_PUBLIC_IS_PLATFORM=false
            NEXT_PUBLIC_SITE_URL=http://localhost:8000
            NEXT_PUBLIC_DISABLED_FEATURES=billing:all,billing:plan_picker,credits:enabled
          platforms: ${{ matrix.platform }}
          # No dry-run branch: every `release: published` run is real, and a push
          # an input can skip is a push that can silently not happen.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest" || { echo "::error::build produced no digest"; exit 1; }
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: powabase-studio manifest merge
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Create + push the multi-arch manifest list
        run: |
          set -euo pipefail
          cd /tmp/digests
          ls -1 | grep -q . || { echo "::error::no digests to assemble"; exit 1; }
          docker buildx imagetools create -t "${{ env.IMAGE }}:${{ needs.resolve.outputs.version }}" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
          # No `| head` here: under `set -o pipefail`, head closing the pipe early
          # sends SIGPIPE to inspect → non-zero → the step fails AFTER a successful push.
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ needs.resolve.outputs.version }}"

      # Tell the downstream consumer a release exists, so it can update its
      # reference to this source without anyone watching for it.
      #
      # Its own App credential, which can do exactly one thing: write to the
      # single repository it is installed on. `owner:` with no `repositories:`
      # scopes the token to that installation, which is also why the destination
      # is not named here — `vars.DOWNSTREAM_REPO` holds it.
      #
      # Last step on purpose. Announcing before the manifest is pushed would send
      # the consumer after an image that does not exist yet.
      - uses: actions/create-github-app-token@v3
        id: dispatch-token
        with:
          app-id: ${{ vars.DISPATCH_BOT_APP_ID }}
          private-key: ${{ secrets.DISPATCH_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Announce the release downstream
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          DOWNSTREAM: ${{ vars.DOWNSTREAM_REPO }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REF: ${{ needs.resolve.outputs.ref }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "${DOWNSTREAM}" || { echo "::error::DOWNSTREAM_REPO is unset; nothing was announced"; exit 1; }
          test -n "${SHA}"        || { echo "::error::no commit resolved; refusing to announce a name without one"; exit 1; }
          # Both are sent: the commit is what a consumer should pin, the tag is
          # what a human reads. Sending only the tag would push the mutability
          # problem downstream.
          gh api "repos/${DOWNSTREAM}/dispatches" \
            -f event_type=oss_release \
            -f 'client_payload[repo]=powabase' \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[ref]=${REF}" \
            -f "client_payload[sha]=${SHA}"
          echo "announced ${REF} (${SHA})"
